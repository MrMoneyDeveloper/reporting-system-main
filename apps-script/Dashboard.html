<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --ink: #17202c;
        --muted: #687385;
        --line: #d9dee8;
        --band: #f5f7fb;
        --panel: #ffffff;
        --accent: #1967d2;
        --risk: #b3261e;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--band);
        font-family: Arial, Helvetica, sans-serif;
      }

      .navbar {
        border-bottom: 1px solid var(--line);
      }

      .app-shell {
        padding: 16px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: none;
      }

      .metric-card .label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .metric-card .value {
        margin-top: 6px;
        font-size: 26px;
        font-weight: 700;
      }

      .chart-box {
        height: 260px;
      }

      .table {
        font-size: 13px;
      }

      .table th {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      .risk-text {
        color: var(--risk);
        font-weight: 700;
      }

      .insight-panel {
        position: sticky;
        top: 12px;
      }

      .insight-text {
        white-space: pre-wrap;
        line-height: 1.45;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 9px;
        color: var(--muted);
        font-size: 12px;
        background: #fff;
      }

      .nav-pills .nav-link {
        border-radius: 6px;
      }

      @media (max-width: 991px) {
        .insight-panel {
          position: static;
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          padding: 10px;
        }

        .chart-box {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="p-4 text-muted">Loading dashboard...</div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
      const h = React.createElement;
      const useEffect = React.useEffect;
      const useMemo = React.useMemo;
      const useRef = React.useRef;
      const useState = React.useState;

      const navItems = [
        ['overview', 'Overview'],
        ['daily', 'Daily'],
        ['weekly', 'Weekly'],
        ['monthly', 'Monthly'],
        ['agent', 'Agent Drilldown'],
        ['risks', 'Risk Flags'],
        ['wfm', 'WFM Balance'],
        ['sync', 'Sync Status']
      ];

      function App() {
        const [bootstrap, setBootstrap] = useState(null);
        const [metrics, setMetrics] = useState(null);
        const [syncStatus, setSyncStatus] = useState(null);
        const [activeTab, setActiveTab] = useState('overview');
        const [filters, setFilters] = useState({ periodType: 'daily', periodKey: '', agentEmail: '', shift: '' });
        const [loading, setLoading] = useState(true);
        const [message, setMessage] = useState('');
        const [insight, setInsight] = useState('Generate an insight for the selected view.');

        useEffect(function () {
          loadBootstrap();
          loadSyncStatus();
        }, []);

        useEffect(function () {
          if (bootstrap) {
            loadMetrics(filters);
          }
        }, [filters.periodType, filters.periodKey, filters.agentEmail, filters.shift]);

        function loadBootstrap() {
          setLoading(true);
          google.script.run
            .withSuccessHandler(function (data) {
              setBootstrap(data);
              const daily = latest((data.periods || {}).daily || []);
              setFilters({ periodType: 'daily', periodKey: daily, agentEmail: '', shift: '' });
              setLoading(false);
            })
            .withFailureHandler(showError)
            .getDashboardBootstrapCached();
        }

        function loadMetrics(nextFilters) {
          setLoading(true);
          google.script.run
            .withSuccessHandler(function (data) {
              setMetrics(data);
              setLoading(false);
              setMessage(data.cache && data.cache.hit ? 'Loaded from cache.' : 'Loaded fresh dashboard data.');
            })
            .withFailureHandler(showError)
            .getDashboardMetricsCached(nextFilters);
        }

        function loadSyncStatus() {
          google.script.run
            .withSuccessHandler(setSyncStatus)
            .withFailureHandler(showError)
            .getDashboardSyncStatus();
        }

        function hardRefresh() {
          setMessage('Hard refresh queued. Source sync will run shortly.');
          setLoading(true);
          google.script.run
            .withSuccessHandler(function (data) {
              setSyncStatus(data.syncStatus);
              setLoading(false);
              setMessage('Hard refresh queued: source sync plus current analytics refresh.');
              loadBootstrap();
              loadMetrics(filters);
              setTimeout(loadSyncStatus, 3000);
            })
            .withFailureHandler(showError)
            .startDashboardHardRefresh(filters);
        }

        function generateInsight() {
          setInsight('Generating insight...');
          google.script.run
            .withSuccessHandler(function (data) {
              setInsight(data.insight || 'No insight returned.');
            })
            .withFailureHandler(showError)
            .getDashboardInsightCached(filters);
        }

        function showError(error) {
          const text = error && error.message ? error.message : String(error);
          setLoading(false);
          setMessage('Error: ' + text);
          setInsight('Error: ' + text);
        }

        function switchTab(tab) {
          setActiveTab(tab);
          if (!bootstrap) return;
          if (tab === 'daily' || tab === 'overview') {
            setFilters(Object.assign({}, filters, { periodType: 'daily', periodKey: latest(bootstrap.periods.daily || []) }));
          } else if (tab === 'weekly') {
            setFilters(Object.assign({}, filters, { periodType: 'weekly', periodKey: latest(bootstrap.periods.weekly || []) }));
          } else if (tab === 'monthly' || tab === 'wfm') {
            setFilters(Object.assign({}, filters, { periodType: 'monthly', periodKey: latest(bootstrap.periods.monthly || []) }));
          }
        }

        const content = renderContent(activeTab, metrics, filters, syncStatus);
        const freshness = metrics && metrics.freshness ? metrics.freshness : {};

        return h(React.Fragment, null,
          h(Navbar, { activeTab, switchTab, hardRefresh, loading }),
          h('main', { className: 'app-shell container-fluid' },
            h(FilterBar, { bootstrap, filters, setFilters, message, loadSyncStatus }),
            h('div', { className: 'row g-3' },
              h('div', { className: 'col-12 col-lg-8 col-xl-9' },
                loading ? h(LoadingCard) : content
              ),
              h('div', { className: 'col-12 col-lg-4 col-xl-3' },
                h(InsightPanel, { insight, generateInsight, freshness, syncStatus })
              )
            )
          )
        );
      }

      function Navbar(props) {
        return h('nav', { className: 'navbar navbar-expand-lg bg-white sticky-top' },
          h('div', { className: 'container-fluid' },
            h('span', { className: 'navbar-brand fw-bold' }, 'BMRX Productivity'),
            h('div', { className: 'd-flex gap-2' },
              h('button', {
                className: 'btn btn-outline-primary btn-sm',
                type: 'button',
                disabled: props.loading,
                onClick: props.hardRefresh
              }, props.loading ? 'Refreshing...' : 'Hard Refresh')
            )
          ),
          h('div', { className: 'container-fluid pb-2' },
            h('ul', { className: 'nav nav-pills flex-nowrap overflow-auto gap-1' },
              navItems.map(function (item) {
                return h('li', { className: 'nav-item', key: item[0] },
                  h('button', {
                    type: 'button',
                    className: 'nav-link text-nowrap ' + (props.activeTab === item[0] ? 'active' : ''),
                    onClick: function () { props.switchTab(item[0]); }
                  }, item[1])
                );
              })
            )
          )
        );
      }

      function FilterBar(props) {
        const bootstrap = props.bootstrap || { periods: {}, agents: [], shifts: [] };
        const periodOptions = (bootstrap.periods || {})[props.filters.periodType] || [];
        return h('section', { className: 'card mb-3' },
          h('div', { className: 'card-body' },
            h('div', { className: 'row g-2 align-items-end' },
              h(SelectField, {
                label: 'Period Type',
                value: props.filters.periodType,
                options: [['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']],
                onChange: function (value) {
                  const periods = (bootstrap.periods || {})[value] || [];
                  props.setFilters(Object.assign({}, props.filters, { periodType: value, periodKey: latest(periods) }));
                }
              }),
              h(SelectField, {
                label: 'Period',
                value: props.filters.periodKey,
                options: periodOptions.map(function (value) { return [value, value]; }),
                onChange: function (value) { props.setFilters(Object.assign({}, props.filters, { periodKey: value })); }
              }),
              h(SelectField, {
                label: 'Shift',
                value: props.filters.shift,
                options: [['', 'All shifts']].concat((bootstrap.shifts || []).map(function (value) { return [value, value]; })),
                onChange: function (value) { props.setFilters(Object.assign({}, props.filters, { shift: value })); }
              }),
              h(SelectField, {
                label: 'Agent',
                value: props.filters.agentEmail,
                options: [['', 'All agents']].concat((bootstrap.agents || []).map(function (agent) { return [agent.email, agent.name]; })),
                onChange: function (value) { props.setFilters(Object.assign({}, props.filters, { agentEmail: value })); }
              })
            ),
            h('div', { className: 'd-flex flex-wrap gap-2 mt-3' },
              h('span', { className: 'status-pill' }, props.message || 'Ready'),
              h('button', { type: 'button', className: 'btn btn-link btn-sm p-0', onClick: props.loadSyncStatus }, 'Refresh sync status')
            )
          )
        );
      }

      function SelectField(props) {
        return h('div', { className: 'col-12 col-sm-6 col-xl-3' },
          h('label', { className: 'form-label small fw-bold text-muted' }, props.label),
          h('select', {
            className: 'form-select form-select-sm',
            value: props.value || '',
            onChange: function (event) { props.onChange(event.target.value); }
          }, props.options.map(function (option) {
            return h('option', { key: option[0], value: option[0] }, option[1]);
          }))
        );
      }

      function LoadingCard() {
        return h('div', { className: 'card' },
          h('div', { className: 'card-body text-muted' }, 'Loading...')
        );
      }

      function renderContent(tab, metrics, filters, syncStatus) {
        if (!metrics) return h(LoadingCard);
        if (tab === 'sync') return h(SyncStatusPage, { metrics, syncStatus });
        if (tab === 'risks') return h(RiskPage, { metrics });
        if (tab === 'wfm') return h(WfmPage, { metrics });
        if (tab === 'agent') return h(AgentPage, { metrics });
        return h(OverviewPage, { metrics, tab, filters });
      }

      function OverviewPage(props) {
        const metrics = props.metrics;
        return h('div', { className: 'd-grid gap-3' },
          h(KpiGrid, { kpis: metrics.kpis, periodType: metrics.filters.periodType }),
          h('div', { className: 'row g-3' },
            h('div', { className: 'col-12 col-xl-6' },
              h(ChartCard, {
                title: 'Shift Summary',
                type: 'bar',
                labels: (metrics.charts.shiftSummary || []).map((row) => row.label),
                datasets: [
                  { label: 'Tickets Solved', data: (metrics.charts.shiftSummary || []).map((row) => row.tickets), backgroundColor: '#1967d2' },
                  { label: 'Actions', data: (metrics.charts.shiftSummary || []).map((row) => row.actions), backgroundColor: '#0f9d58' }
                ]
              })
            ),
            h('div', { className: 'col-12 col-xl-6' },
              h(ChartCard, {
                title: 'Attendance vs Tickets',
                type: 'bar',
                labels: (metrics.charts.attendanceVsTickets || []).map((row) => row.label),
                datasets: [
                  { label: 'Attendance %', data: (metrics.charts.attendanceVsTickets || []).map((row) => row.attendance), backgroundColor: '#5f6b7a' },
                  { label: 'Tickets', data: (metrics.charts.attendanceVsTickets || []).map((row) => row.tickets), backgroundColor: '#1967d2' }
                ]
              })
            )
          ),
          h('div', { className: 'row g-3' },
            h('div', { className: 'col-12 col-xl-6' },
              h(TableCard, { title: 'Top Ticket Volume', rows: metrics.rankings.topTickets || [], columns: columnsFor('tickets') })
            ),
            h('div', { className: 'col-12 col-xl-6' },
              h(TableCard, { title: 'Risk Flags', rows: metrics.risks || [], columns: columnsFor('risk') })
            )
          ),
          h(TableCard, { title: 'Agent Metrics', rows: metrics.rows || [], columns: columnsFor('agent') })
        );
      }

      function RiskPage(props) {
        return h('div', { className: 'd-grid gap-3' },
          h(KpiGrid, { kpis: props.metrics.kpis, periodType: props.metrics.filters.periodType }),
          h(TableCard, { title: 'Risk Flags', rows: props.metrics.risks || [], columns: columnsFor('risk'), pageSize: 15 })
        );
      }

      function WfmPage(props) {
        const data = props.metrics.charts.wfmBalance || [];
        return h('div', { className: 'd-grid gap-3' },
          h(ChartCard, {
            title: 'WFM Balance',
            type: 'bar',
            labels: data.map((row) => row.label),
            datasets: [
              { label: 'Outstanding Hours', data: data.map((row) => row.outstanding), backgroundColor: '#b3261e' },
              { label: 'Surplus Hours', data: data.map((row) => row.surplus), backgroundColor: '#0f9d58' }
            ]
          }),
          h(TableCard, { title: 'Monthly WFM Metrics', rows: props.metrics.rows || [], columns: columnsFor('wfm'), pageSize: 15 })
        );
      }

      function AgentPage(props) {
        return h('div', { className: 'd-grid gap-3' },
          h(TableCard, { title: 'Selected Period Agent Metrics', rows: props.metrics.rows || [], columns: columnsFor('agent'), pageSize: 15 }),
          h(TableCard, { title: 'Recent Agent Drilldown', rows: props.metrics.agentDrilldown || [], columns: columnsFor('drilldown'), pageSize: 14 })
        );
      }

      function SyncStatusPage(props) {
        const freshness = props.metrics.freshness || {};
        const cache = props.metrics.cache || {};
        const sync = props.syncStatus || {};
        const source = sync.sourceSync || {};
        const analytics = sync.analytics || {};
        const apiLogging = sync.apiLogging || {};
        const triggers = (sync.triggers || {});
        const expected = triggers.expected || [];
        const present = triggers.present || [];
        const triggerRows = expected.map(function (handler) {
          return { handler: handler, present: present.indexOf(handler) !== -1 ? 'Present' : 'Missing' };
        });
        return h('div', { className: 'd-grid gap-3' },
          h('div', { className: 'row g-3' },
            h(StatusCard, { label: 'Last Source Sync', value: freshness.lastSourceSync || 'Not recorded' }),
            h(StatusCard, { label: 'Last Analytics Refresh', value: freshness.lastAnalyticsRefresh || 'Not recorded' }),
            h(StatusCard, { label: 'Latest WFM Upload', value: freshness.latestWfmImport || 'None' }),
            h(StatusCard, { label: 'Cache Generated', value: cache.generatedAt || 'Not cached' })
          ),
          h('div', { className: 'row g-3' },
            h(StatusCard, { label: 'Source Job', value: source.active ? ('Active: ' + source.phase + ' ' + source.cursor + ' -> ' + source.end) : 'Idle' }),
            h(StatusCard, { label: 'Analytics Job', value: analytics.active ? ('Active: ' + analytics.phase + ' ' + analytics.cursor + ' -> ' + analytics.end) : 'Idle' }),
            h(StatusCard, { label: 'Cache Version', value: sync.cacheVersion || freshness.cacheVersion || '-' }),
            h(StatusCard, { label: 'Status Checked', value: sync.generatedAt || '-' })
          ),
          h('div', { className: 'row g-3' },
            h(StatusCard, { label: 'Last API Request', value: freshness.lastDashboardApiRequest || apiLogging.lastRequestAt || 'Not recorded' }),
            h(StatusCard, { label: 'Last API Endpoint', value: freshness.lastDashboardApiEndpoint || apiLogging.lastEndpoint || '-' }),
            h(StatusCard, { label: 'API Log Mode', value: apiLogging.mode || 'SUMMARY' }),
            h(StatusCard, { label: 'Cache TTL', value: (apiLogging.cacheTtlSeconds || '-') + ' sec' })
          ),
          h(TableCard, { title: 'Managed Triggers', rows: triggerRows, columns: [{ key: 'handler', label: 'Handler' }, { key: 'present', label: 'Status' }], pageSize: 12 }),
          h(TableCard, {
            title: 'Current Rows',
            rows: [
              { name: 'Daily Agent Metrics', count: freshness.dailyMetricRows || 0 },
              { name: 'Weekly Agent Metrics', count: freshness.weeklyMetricRows || 0 },
              { name: 'Monthly Agent Metrics', count: freshness.monthlyMetricRows || 0 }
            ],
            columns: [{ key: 'name', label: 'Table' }, { key: 'count', label: 'Rows' }],
            pageSize: 10
          })
        );
      }

      function KpiGrid(props) {
        const k = props.kpis || {};
        return h('div', { className: 'row g-3' },
          h(KpiCard, { label: 'Agents', value: k.agents }),
          h(KpiCard, { label: 'Attendance', value: formatPercent(k.attendancePercent) }),
          h(KpiCard, { label: 'Tickets Solved', value: k.ticketsSolved }),
          h(KpiCard, { label: 'Actions', value: k.productivityActions }),
          h(KpiCard, { label: 'Expected Hours', value: formatNumber(k.expectedHours) }),
          h(KpiCard, { label: 'WFM Owed', value: props.periodType === 'monthly' ? formatNumber(k.wfmOutstandingHours) : '-' })
        );
      }

      function KpiCard(props) {
        return h('div', { className: 'col-6 col-md-4 col-xl-2' },
          h('div', { className: 'card metric-card h-100' },
            h('div', { className: 'card-body' },
              h('div', { className: 'label' }, props.label),
              h('div', { className: 'value' }, displayValue(props.value))
            )
          )
        );
      }

      function StatusCard(props) {
        return h('div', { className: 'col-12 col-sm-6 col-xl-3' },
          h('div', { className: 'card h-100' },
            h('div', { className: 'card-body' },
              h('div', { className: 'small text-muted fw-bold text-uppercase' }, props.label),
              h('div', { className: 'mt-2 fw-semibold' }, props.value)
            )
          )
        );
      }

      function ChartCard(props) {
        const ref = useRef(null);
        const chartRef = useRef(null);
        const signature = JSON.stringify({ labels: props.labels, datasets: props.datasets, type: props.type });

        useEffect(function () {
          if (!ref.current || !window.Chart) return;
          if (chartRef.current) chartRef.current.destroy();
          chartRef.current = new Chart(ref.current, {
            type: props.type || 'bar',
            data: { labels: props.labels || [], datasets: props.datasets || [] },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } },
              scales: { y: { beginAtZero: true } }
            }
          });
          return function () {
            if (chartRef.current) chartRef.current.destroy();
          };
        }, [signature]);

        return h('div', { className: 'card h-100' },
          h('div', { className: 'card-header bg-white fw-bold' }, props.title),
          h('div', { className: 'card-body chart-box' }, h('canvas', { ref: ref }))
        );
      }

      function TableCard(props) {
        const [page, setPage] = useState(0);
        const rows = props.rows || [];
        const columns = props.columns || [];
        const pageSize = props.pageSize || 10;
        const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
        const currentPage = Math.min(page, totalPages - 1);
        const visible = rows.slice(currentPage * pageSize, currentPage * pageSize + pageSize);

        useEffect(function () { setPage(0); }, [rows.length, props.title]);

        return h('div', { className: 'card' },
          h('div', { className: 'card-header bg-white d-flex justify-content-between align-items-center gap-2' },
            h('span', { className: 'fw-bold' }, props.title),
            h('span', { className: 'small text-muted' }, rows.length + ' row(s)')
          ),
          h('div', { className: 'table-responsive' },
            h('table', { className: 'table table-sm align-middle mb-0' },
              h('thead', null, h('tr', null, columns.map(function (column) {
                return h('th', { key: column.key }, column.label);
              }))),
              h('tbody', null,
                visible.length ? visible.map(function (row, rowIndex) {
                  return h('tr', { key: row.agentEmail + '_' + row.period + '_' + rowIndex },
                    columns.map(function (column) {
                      const value = column.render ? column.render(row[column.key], row) : row[column.key];
                      return h('td', { key: column.key }, value || value === 0 ? value : '-');
                    })
                  );
                }) : h('tr', null, h('td', { colSpan: columns.length || 1, className: 'text-muted' }, 'No rows'))
              )
            )
          ),
          h('div', { className: 'card-footer bg-white d-flex justify-content-between align-items-center' },
            h('button', { className: 'btn btn-outline-secondary btn-sm', disabled: currentPage === 0, onClick: function () { setPage(currentPage - 1); } }, 'Previous'),
            h('span', { className: 'small text-muted' }, 'Page ' + (currentPage + 1) + ' of ' + totalPages),
            h('button', { className: 'btn btn-outline-secondary btn-sm', disabled: currentPage >= totalPages - 1, onClick: function () { setPage(currentPage + 1); } }, 'Next')
          )
        );
      }

      function InsightPanel(props) {
        const freshness = props.freshness || {};
        return h('div', { className: 'card insight-panel' },
          h('div', { className: 'card-header bg-white d-flex justify-content-between align-items-center' },
            h('span', { className: 'fw-bold' }, 'AI Insight'),
            h('button', { className: 'btn btn-outline-primary btn-sm', type: 'button', onClick: props.generateInsight }, 'Generate')
          ),
          h('div', { className: 'card-body' },
            h('div', { className: 'insight-text mb-3' }, props.insight),
            h('div', { className: 'small text-muted d-grid gap-1' },
              h('div', null, 'Last source sync: ' + (freshness.lastSourceSync || 'Not recorded')),
              h('div', null, 'Last analytics refresh: ' + (freshness.lastAnalyticsRefresh || 'Not recorded')),
              h('div', null, 'Latest WFM upload: ' + (freshness.latestWfmImport || 'None')),
              h('div', null, 'Cache: ' + ((props.freshness && props.freshness.cacheVersion) || 'Pending'))
            )
          )
        );
      }

      function columnsFor(type) {
        const percent = function (value) { return formatPercent(value); };
        const number = function (value) { return formatNumber(value); };
        const risk = function (value) { return value ? h('span', { className: 'risk-text' }, value) : '-'; };
        const base = [
          { key: 'agentName', label: 'Agent' },
          { key: 'shift', label: 'Shift' },
          { key: 'attendancePercent', label: 'Attendance', render: percent },
          { key: 'ticketsSolved', label: 'Solved' },
          { key: 'ticketsUpdated', label: 'Updated' },
          { key: 'ticketsCreated', label: 'Created' },
          { key: 'productivityActions', label: 'Actions' },
          { key: 'notes', label: 'Notes', render: risk }
        ];
        if (type === 'tickets') return [base[0], base[1], base[3], base[6]];
        if (type === 'risk') return [base[0], base[1], base[2], base[3], { key: 'wfmOutstandingHours', label: 'WFM Owed', render: number }, base[7]];
        if (type === 'wfm') return [base[0], base[1], { key: 'wfmTotalHours', label: 'WFM Total', render: number }, { key: 'wfmProductiveHours', label: 'Productive', render: number }, { key: 'wfmGeneralTaskHours', label: 'General', render: number }, { key: 'wfmOutstandingHours', label: 'Owed', render: number }, { key: 'wfmSurplusHours', label: 'Surplus', render: number }, { key: 'wfmNotes', label: 'WFM Notes', render: risk }];
        if (type === 'drilldown') return [{ key: 'period', label: 'Date' }, base[1], base[2], base[3], base[4], base[5], base[7]];
        return base;
      }

      function latest(values) {
        return values && values.length ? values[values.length - 1] : '';
      }

      function formatPercent(value) {
        if (value === '' || value === null || value === undefined) return '-';
        return Math.round(Number(value) * 100) + '%';
      }

      function formatNumber(value) {
        if (value === '' || value === null || value === undefined) return '-';
        const number = Number(value);
        if (Number.isNaN(number)) return '-';
        return number.toFixed(2).replace(/\.00$/, '');
      }

      function displayValue(value) {
        return value === '' || value === null || value === undefined ? '-' : value;
      }

      ReactDOM.createRoot(document.getElementById('app')).render(h(App));
    </script>
  </body>
</html>
